<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="agBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06221A" />
      <stop offset="50%" stop-color="#0A1628" />
      <stop offset="100%" stop-color="#040D14" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#agBg)" />

  <!-- Cyber grid -->
  <g stroke="rgba(16, 185, 129, 0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Big Central Leaf & AI HUD -->
  <g transform="translate(400, 240)">
    <!-- Targeting Scan Box -->
    <rect x="-170" y="-140" width="340" height="280" rx="16" fill="rgba(6, 18, 25, 0.7)" stroke="#10B981" stroke-width="1.5" stroke-dasharray="12 8" />
    
    <!-- Target corners -->
    <path d="M -180 -110 L -180 -150 L -140 -150" fill="none" stroke="#06B6D4" stroke-width="3" />
    <path d="M 140 -150 L 180 -150 L 180 -110" fill="none" stroke="#06B6D4" stroke-width="3" />
    <path d="M -180 110 L -180 150 L -140 150" fill="none" stroke="#06B6D4" stroke-width="3" />
    <path d="M 140 150 L 180 150 L 180 110" fill="none" stroke="#06B6D4" stroke-width="3" />

    <!-- Stylized Leaf -->
    <path d="M 0 -80 C 70 -50 90 40 0 100 C -90 40 -70 -50 0 -80 Z" fill="url(#leafGrad)" opacity="0.9" />
    <path d="M 0 -70 L 0 90" stroke="#ECFDF5" stroke-width="2.5" opacity="0.6" />
    <path d="M 0 -30 Q 30 -40 50 -20" stroke="#ECFDF5" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 0 0 Q -30 -10 -50 10" stroke="#ECFDF5" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 0 30 Q 25 20 40 40" stroke="#ECFDF5" stroke-width="1.5" fill="none" opacity="0.6" />

    <!-- Neural Scan Beam -->
    <line x1="-150" y1="-10" x2="150" y2="-10" stroke="#06B6D4" stroke-width="3" filter="url(#glow)">
      <animate attributeName="y1" values="-120;120;-120" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="-120;120;-120" dur="4s" repeatCount="indefinite" />
    </line>

    <!-- Scan tag -->
    <rect x="-100" y="70" width="200" height="32" rx="8" fill="#042F2E" stroke="#10B981" stroke-width="1" />
    <text x="0" y="91" font-family="monospace" font-size="13" font-weight="bold" fill="#34D399" text-anchor="middle">DIAGNOSIS: 98.4% HEALTHY</text>
  </g>

  <!-- Left Telemetry Card -->
  <g transform="translate(60, 100)">
    <rect width="180" height="120" rx="12" fill="rgba(10, 20, 30, 0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="16" y="32" font-family="sans-serif" font-size="12" fill="#94A3B8" font-weight="600">SOIL MOISTURE</text>
    <text x="16" y="68" font-family="sans-serif" font-size="28" fill="#38BDF8" font-weight="800">68%</text>
    <rect x="16" y="86" width="148" height="6" rx="3" fill="#1E293B" />
    <rect x="16" y="86" width="100" height="6" rx="3" fill="#38BDF8" />
  </g>

  <!-- Right IoT Sensors Card -->
  <g transform="translate(560, 260)">
    <rect width="180" height="130" rx="12" fill="rgba(10, 20, 30, 0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="16" y="30" font-family="sans-serif" font-size="12" fill="#94A3B8" font-weight="600">IoT TELEMETRY</text>
    <text x="16" y="58" font-family="monospace" font-size="13" fill="#10B981">● ESP32: ONLINE</text>
    <text x="16" y="82" font-family="monospace" font-size="13" fill="#F8FAFC">Temp: 27.4°C</text>
    <text x="16" y="106" font-family="monospace" font-size="13" fill="#F8FAFC">Humidity: 62%</text>
  </g>

  <!-- Header Overlay -->
  <g transform="translate(60, 60)">
    <rect width="150" height="28" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="75" y="19" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399" text-anchor="middle">AI + SMART FARMING</text>
  </g>
</svg>
