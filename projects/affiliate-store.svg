<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="storeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140B28" />
      <stop offset="50%" stop-color="#0E0D1B" />
      <stop offset="100%" stop-color="#05050A" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="violetG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#storeBg)" />

  <!-- Grid lines -->
  <g stroke="rgba(139, 92, 246, 0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Store Browser Mockup Window -->
  <g transform="translate(100, 50)">
    <!-- Browser Window Chrome -->
    <rect width="600" height="380" rx="14" fill="#0C0D16" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="600" height="40" rx="14" fill="#141523" />
    <circle cx="25" cy="20" r="5" fill="#EF4444" />
    <circle cx="42" cy="20" r="5" fill="#F59E0B" />
    <circle cx="59" cy="20" r="5" fill="#10B981" />
    
    <!-- Search Bar -->
    <rect x="120" y="8" width="360" height="24" rx="6" fill="#1E2033" />
    <text x="200" y="24" font-family="monospace" font-size="11" fill="#94A3B8">amazon-must-haves.dev/deals</text>

    <!-- Header inside window -->
    <text x="35" y="80" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Amazon Must Haves 🔥</text>
    <text x="35" y="100" font-family="sans-serif" font-size="12" fill="#94A3B8">Curated Trending Deals &amp; Top Rated Essentials • Powered by Django</text>

    <!-- Category Pills -->
    <g transform="translate(35, 120)">
      <rect width="80" height="24" rx="12" fill="url(#violetG)" />
      <text x="40" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFF" text-anchor="middle">Trending</text>
      
      <rect x="90" width="80" height="24" rx="12" fill="#1E2033" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="130" y="16" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Tech &amp; AI</text>

      <rect x="180" width="85" height="24" rx="12" fill="#1E2033" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="222" y="16" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Smart Home</text>
    </g>

    <!-- Product Cards Grid -->
    <g transform="translate(35, 160)">
      <!-- Card 1 -->
      <g>
        <rect width="165" height="190" rx="10" fill="#141624" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <rect x="10" y="10" width="145" height="95" rx="6" fill="#1F233A" />
        <circle cx="82" cy="57" r="24" fill="#3B82F6" opacity="0.3" />
        <text x="82" y="62" font-family="sans-serif" font-size="24" text-anchor="middle">🎧</text>
        <text x="12" y="125" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC">ANC Headphones</text>
        <text x="12" y="145" font-family="sans-serif" font-size="14" font-weight="800" fill="#F59E0B">$149.99</text>
        <rect x="12" y="155" width="141" height="24" rx="4" fill="url(#accentOrange)" />
        <text x="82" y="171" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF" text-anchor="middle">VIEW ON AMAZON ↗</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(180, 0)">
        <rect width="165" height="190" rx="10" fill="#141624" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <rect x="10" y="10" width="145" height="95" rx="6" fill="#1F233A" />
        <circle cx="82" cy="57" r="24" fill="#10B981" opacity="0.3" />
        <text x="82" y="62" font-family="sans-serif" font-size="24" text-anchor="middle">💡</text>
        <text x="12" y="125" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC">Smart RGB Desk Lamp</text>
        <text x="12" y="145" font-family="sans-serif" font-size="14" font-weight="800" fill="#F59E0B">$39.99</text>
        <rect x="12" y="155" width="141" height="24" rx="4" fill="url(#accentOrange)" />
        <text x="82" y="171" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF" text-anchor="middle">VIEW ON AMAZON ↗</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(360, 0)">
        <rect width="165" height="190" rx="10" fill="#141624" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <rect x="10" y="10" width="145" height="95" rx="6" fill="#1F233A" />
        <circle cx="82" cy="57" r="24" fill="#EC4899" opacity="0.3" />
        <text x="82" y="62" font-family="sans-serif" font-size="24" text-anchor="middle">⚡</text>
        <text x="12" y="125" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC">MagSafe 3-in-1 Dock</text>
        <text x="12" y="145" font-family="sans-serif" font-size="14" font-weight="800" fill="#F59E0B">$59.00</text>
        <rect x="12" y="155" width="141" height="24" rx="4" fill="url(#accentOrange)" />
        <text x="82" y="171" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFF" text-anchor="middle">VIEW ON AMAZON ↗</text>
      </g>
    </g>
  </g>
</svg>
