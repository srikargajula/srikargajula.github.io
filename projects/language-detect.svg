<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051B24" />
      <stop offset="50%" stop-color="#0A1628" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#ldBg)" />

  <!-- Global Network Lines -->
  <g stroke="rgba(6, 182, 212, 0.15)" stroke-width="1.5">
    <!-- Globe wireframe -->
    <circle cx="400" cy="240" r="160" fill="none" stroke-dasharray="6 6" />
    <ellipse cx="400" cy="240" rx="160" ry="60" fill="none" />
    <ellipse cx="400" cy="240" rx="70" ry="160" fill="none" />
    <line x1="240" y1="240" x2="560" y2="240" />
  </g>

  <!-- Multilingual Floating Words -->
  <g font-family="sans-serif" font-weight="bold">
    <text x="370" y="160" font-size="28" fill="#F8FAFC" text-anchor="middle">Hello</text>
    <text x="470" y="210" font-size="24" fill="#38BDF8" text-anchor="middle">నమస్కారం</text>
    <text x="320" y="280" font-size="24" fill="#34D399" text-anchor="middle">नमस्ते</text>
    <text x="490" y="310" font-size="20" fill="#F472B6" text-anchor="middle">Bonjour</text>
    <text x="280" y="190" font-size="18" fill="#FBBF24" text-anchor="middle">Hola</text>
    <text x="450" y="130" font-size="16" fill="#A78BFA" text-anchor="middle">Ciao</text>
    <text x="330" y="340" font-size="16" fill="#94A3B8" text-anchor="middle">こんにちは</text>
  </g>

  <!-- Live Predictor UI Box -->
  <g transform="translate(100, 360)">
    <rect width="600" height="80" rx="14" fill="#0E1E2C" stroke="#06B6D4" stroke-width="1.5" />
    <text x="24" y="32" font-family="monospace" font-size="12" fill="#94A3B8">INPUT: "Machine learning models empower modern healthcare"</text>
    
    <g transform="translate(24, 44)">
      <rect width="180" height="24" rx="6" fill="#042F2E" stroke="#10B981" stroke-width="1" />
      <text x="90" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34D399" text-anchor="middle">PREDICTED: ENGLISH (99.8%)</text>
      
      <text x="220" y="16" font-family="monospace" font-size="11" fill="#67E8F9">Latency: 28ms • TF-IDF + MultinomialNB</text>
    </g>
  </g>

  <!-- Tag Pill Top Left -->
  <g transform="translate(60, 40)">
    <rect width="240" height="30" rx="8" fill="#082F3B" stroke="#06B6D4" stroke-width="1" />
    <text x="120" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#22D3EE" text-anchor="middle">NLP • 20+ LANGUAGES DETECTED</text>
  </g>
</svg>
