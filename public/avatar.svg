<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0A0B10" />
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="skinG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D5B8" />
      <stop offset="100%" stop-color="#D99B77" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#6366F1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgG)" />
  
  <!-- Outer decorative tech circles -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#accentG)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="200" cy="200" r="155" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.2" />

  <!-- Backdrop Glow -->
  <circle cx="200" cy="180" r="110" fill="url(#accentG)" opacity="0.2" filter="blur(30px)" />

  <!-- Modern Stylized Character Illustration -->
  <g id="character" filter="url(#shadow)">
    <!-- Shoulders & Coat -->
    <path d="M 100 370 C 100 290 140 260 200 260 C 260 260 300 290 300 370 Z" fill="#1E2235" />
    <path d="M 140 265 L 200 320 L 260 265 L 235 370 L 165 370 Z" fill="#0F111A" />
    <!-- Shirt / Collar -->
    <polygon points="180,260 200,290 220,260 200,250" fill="#3B82F6" opacity="0.9" />
    <polygon points="190,260 200,278 210,260" fill="#E2E8F0" />
    
    <!-- Neck -->
    <rect x="184" y="220" width="32" height="45" rx="6" fill="#D99B77" />
    
    <!-- Head Base -->
    <path d="M 145 165 C 145 105 255 105 255 165 C 255 225 235 245 200 245 C 165 245 145 225 145 165 Z" fill="url(#skinG)" />
    
    <!-- Ears -->
    <circle cx="144" cy="170" r="12" fill="#D99B77" />
    <circle cx="256" cy="170" r="12" fill="#D99B77" />
    
    <!-- Modern Tech Hair -->
    <path d="M 140 150 C 140 90 170 65 210 65 C 245 65 265 85 262 135 C 255 115 235 110 210 110 C 180 110 155 125 140 150 Z" fill="#18181B" />
    <path d="M 150 120 C 175 75 230 75 258 105 C 250 85 230 70 205 70 C 180 70 158 90 150 120 Z" fill="#27272A" />

    <!-- Eyeglasses (Sophisticated Tech/Engineering Vibe) -->
    <rect x="156" y="150" width="36" height="24" rx="8" fill="none" stroke="#6366F1" stroke-width="3.5" />
    <rect x="208" y="150" width="36" height="24" rx="8" fill="none" stroke="#6366F1" stroke-width="3.5" />
    <line x1="192" y1="162" x2="208" y2="162" stroke="#6366F1" stroke-width="3.5" />
    <line x1="144" y1="160" x2="156" y2="162" stroke="#6366F1" stroke-width="2.5" />
    <line x1="244" y1="162" x2="256" y2="160" stroke="#6366F1" stroke-width="2.5" />

    <!-- Eyes inside glasses -->
    <circle cx="174" cy="162" r="4.5" fill="#1E293B" />
    <circle cx="226" cy="162" r="4.5" fill="#1E293B" />
    <circle cx="176" cy="160" r="1.5" fill="#FFFFFF" />
    <circle cx="228" cy="160" r="1.5" fill="#FFFFFF" />

    <!-- Eyebrows -->
    <path d="M 158 142 Q 174 137 190 143" fill="none" stroke="#18181B" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 210 143 Q 226 137 242 142" fill="none" stroke="#18181B" stroke-width="3.5" stroke-linecap="round" />

    <!-- Smile / Confidence -->
    <path d="M 186 205 Q 200 215 214 205" fill="none" stroke="#8A4A32" stroke-width="3" stroke-linecap="round" />
    
    <!-- Modern Tech Nodes Floating -->
    <circle cx="85" cy="120" r="14" fill="#1E1B4B" stroke="#6366F1" stroke-width="2" />
    <path d="M 80 120 L 90 120 M 85 115 L 85 125" stroke="#06B6D4" stroke-width="2" />
    
    <circle cx="320" cy="130" r="16" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2" />
    <circle cx="320" cy="130" r="5" fill="#06B6D4" />
    
    <circle cx="95" cy="260" r="12" fill="#0A0B10" stroke="#06B6D4" stroke-width="2" />
    <circle cx="310" cy="270" r="12" fill="#0A0B10" stroke="#10B981" stroke-width="2" />
  </g>

  <!-- Live Status Floating Badge -->
  <g transform="translate(110, 340)">
    <rect width="180" height="34" rx="17" fill="#090A0F" stroke="#10B981" stroke-width="1.5" />
    <circle cx="24" cy="17" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">AI ENGINEER • eMP</text>
  </g>
</svg>
