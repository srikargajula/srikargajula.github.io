<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="jwtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091326" />
      <stop offset="50%" stop-color="#0B1930" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#jwtBg)" />

  <!-- Cyber network background -->
  <g stroke="rgba(6, 182, 212, 0.1)" stroke-width="1">
    <circle cx="400" cy="240" r="160" fill="none" stroke-dasharray="8 6" />
    <circle cx="400" cy="240" r="220" fill="none" stroke-dasharray="4 8" opacity="0.5" />
    <line x1="100" y1="240" x2="700" y2="240" />
    <line x1="400" y1="40" x2="400" y2="440" />
  </g>

  <!-- Big Central Lock Shield -->
  <g transform="translate(400, 240)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="70" fill="#06B6D4" opacity="0.15" />
    
    <!-- Shield / Lock Body -->
    <rect x="-45" y="-15" width="90" height="75" rx="14" fill="#0E1E38" stroke="#38BDF8" stroke-width="3" />
    
    <!-- Shackle -->
    <path d="M -26 -15 L -26 -45 C -26 -65 26 -65 26 -45 L 26 -15" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
    
    <!-- Keyhole -->
    <circle cx="0" cy="15" r="8" fill="#38BDF8" />
    <polygon points="-5,18 5,18 3,36 -3,36" fill="#38BDF8" />
  </g>

  <!-- Left Card: JWT Structure breakdown -->
  <g transform="translate(60, 100)">
    <rect width="250" height="280" rx="14" fill="#0B1322" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
    <text x="20" y="36" font-family="monospace" font-size="13" font-weight="bold" fill="#38BDF8">JWT TOKEN PAYLOAD</text>
    
    <!-- Header part -->
    <rect x="18" y="55" width="214" height="45" rx="6" fill="#171727" stroke="#EC4899" stroke-width="1" />
    <text x="28" y="74" font-family="monospace" font-size="11" fill="#F472B6">header (alg: "HS256")</text>
    <text x="28" y="90" font-family="monospace" font-size="10" fill="#94A3B8">eyJhbGciOiJIUzI1NiJ9...</text>

    <!-- Payload part -->
    <rect x="18" y="110" width="214" height="60" rx="6" fill="#171727" stroke="#A855F7" stroke-width="1" />
    <text x="28" y="130" font-family="monospace" font-size="11" fill="#C084FC">payload (sub, role, iat)</text>
    <text x="28" y="146" font-family="monospace" font-size="10" fill="#E2E8F0">role: "admin", exp: 3600</text>
    <text x="28" y="160" font-family="monospace" font-size="10" fill="#94A3B8">eyJzdWIiOiIxMjM0NTY3... </text>

    <!-- Signature part -->
    <rect x="18" y="180" width="214" height="45" rx="6" fill="#171727" stroke="#06B6D4" stroke-width="1" />
    <text x="28" y="200" font-family="monospace" font-size="11" fill="#22D3EE">signature (verifySecret)</text>
    <text x="28" y="215" font-family="monospace" font-size="10" fill="#94A3B8">SflKxwRJSMeKKF2QT4fwpM...</text>

    <!-- Status pill -->
    <rect x="18" y="238" width="120" height="24" rx="12" fill="#065F46" />
    <text x="78" y="254" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6EE7B7" text-anchor="middle">STATUS: VERIFIED</text>
  </g>

  <!-- Right Card: API Security Features -->
  <g transform="translate(500, 100)">
    <rect width="240" height="280" rx="14" fill="#0B1322" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
    <text x="20" y="36" font-family="monospace" font-size="13" font-weight="bold" fill="#38BDF8">SECURITY MIDDLEWARE</text>
    
    <g transform="translate(20, 60)">
      <circle cx="10" cy="12" r="5" fill="#10B981" />
      <text x="25" y="16" font-family="sans-serif" font-size="12" fill="#E2E8F0">Bcrypt Salt Rounds: 12</text>
    </g>

    <g transform="translate(20, 100)">
      <circle cx="10" cy="12" r="5" fill="#10B981" />
      <text x="25" y="16" font-family="sans-serif" font-size="12" fill="#E2E8F0">Token Rotation &amp; Revocation</text>
    </g>

    <g transform="translate(20, 140)">
      <circle cx="10" cy="12" r="5" fill="#10B981" />
      <text x="25" y="16" font-family="sans-serif" font-size="12" fill="#E2E8F0">HTTP-Only Cookie Guards</text>
    </g>

    <g transform="translate(20, 180)">
      <circle cx="10" cy="12" r="5" fill="#10B981" />
      <text x="25" y="16" font-family="sans-serif" font-size="12" fill="#E2E8F0">Rate-Limiter Protected</text>
    </g>

    <g transform="translate(20, 220)">
      <rect width="200" height="36" rx="8" fill="#1E293B" />
      <text x="100" y="22" font-family="monospace" font-size="11" fill="#38BDF8" text-anchor="middle">POST /api/v1/auth/login</text>
    </g>
  </g>
</svg>
