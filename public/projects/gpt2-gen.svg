<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="gptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1035" />
      <stop offset="50%" stop-color="#0E0824" />
      <stop offset="100%" stop-color="#05030A" />
    </linearGradient>
    <linearGradient id="nodeG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#gptBg)" />

  <!-- Neural Attention matrix network lines -->
  <g stroke="rgba(168, 85, 247, 0.2)" stroke-width="1.5">
    <line x1="120" y1="120" x2="300" y2="200" />
    <line x1="120" y1="200" x2="300" y2="200" />
    <line x1="120" y1="280" x2="300" y2="200" />
    <line x1="120" y1="360" x2="300" y2="280" />
    
    <line x1="300" y1="200" x2="500" y2="160" />
    <line x1="300" y1="200" x2="500" y2="240" />
    <line x1="300" y1="280" x2="500" y2="240" />
    <line x1="300" y1="280" x2="500" y2="320" />
    
    <line x1="500" y1="160" x2="680" y2="200" />
    <line x1="500" y1="240" x2="680" y2="200" />
    <line x1="500" y1="320" x2="680" y2="280" />
  </g>

  <!-- Input Tokens -->
  <g transform="translate(60, 95)">
    <rect width="110" height="36" rx="6" fill="#1C1838" stroke="#8B5CF6" stroke-width="1" />
    <text x="55" y="22" font-family="monospace" font-size="12" fill="#E9D5FF" text-anchor="middle">[Prompt: AI]</text>
  </g>
  <g transform="translate(60, 175)">
    <rect width="110" height="36" rx="6" fill="#1C1838" stroke="#8B5CF6" stroke-width="1" />
    <text x="55" y="22" font-family="monospace" font-size="12" fill="#E9D5FF" text-anchor="middle">[is creating]</text>
  </g>
  <g transform="translate(60, 255)">
    <rect width="110" height="36" rx="6" fill="#1C1838" stroke="#8B5CF6" stroke-width="1" />
    <text x="55" y="22" font-family="monospace" font-size="12" fill="#E9D5FF" text-anchor="middle">[practical]</text>
  </g>
  <g transform="translate(60, 335)">
    <rect width="110" height="36" rx="6" fill="#1C1838" stroke="#8B5CF6" stroke-width="1" />
    <text x="55" y="22" font-family="monospace" font-size="12" fill="#E9D5FF" text-anchor="middle">[solutions]</text>
  </g>

  <!-- Transformer Multi-Head Self-Attention Block -->
  <g transform="translate(230, 80)">
    <rect width="140" height="260" rx="12" fill="rgba(30, 20, 60, 0.85)" stroke="#C084FC" stroke-width="1.5" />
    <text x="70" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F3E8FF" text-anchor="middle">GPT-2 TRANSFORMER</text>
    <text x="70" y="50" font-family="monospace" font-size="10" fill="#C084FC" text-anchor="middle">12-Layer Attention</text>

    <!-- Internal sub-blocks -->
    <rect x="15" y="70" width="110" height="32" rx="4" fill="#3B2064" />
    <text x="70" y="90" font-family="monospace" font-size="10" fill="#E9D5FF" text-anchor="middle">Multi-Head Attn</text>

    <rect x="15" y="112" width="110" height="32" rx="4" fill="#3B2064" />
    <text x="70" y="132" font-family="monospace" font-size="10" fill="#E9D5FF" text-anchor="middle">Feed Forward</text>

    <rect x="15" y="154" width="110" height="32" rx="4" fill="#3B2064" />
    <text x="70" y="174" font-family="monospace" font-size="10" fill="#E9D5FF" text-anchor="middle">LayerNorm</text>

    <rect x="15" y="196" width="110" height="32" rx="4" fill="#2E1065" stroke="#A855F7" stroke-width="1" />
    <text x="70" y="216" font-family="monospace" font-size="10" fill="#A855F7" text-anchor="middle">Top-P / Nucleus</text>
  </g>

  <!-- Output Generation Terminal -->
  <g transform="translate(440, 100)">
    <rect width="300" height="240" rx="12" fill="#0C0A17" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5" />
    <rect width="300" height="32" rx="12" fill="#17122C" />
    <circle cx="20" cy="16" r="4" fill="#EF4444" />
    <circle cx="32" cy="16" r="4" fill="#F59E0B" />
    <circle cx="44" cy="16" r="4" fill="#10B981" />
    <text x="60" y="20" font-family="monospace" font-size="11" fill="#C084FC">gpt2_inference.py</text>

    <text x="20" y="65" font-family="monospace" font-size="12" fill="#A78BFA">&gt; Temperature: 0.7</text>
    <text x="20" y="85" font-family="monospace" font-size="12" fill="#A78BFA">&gt; Top_k: 40 | Top_p: 0.9</text>
    
    <text x="20" y="125" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">"AI is transforming modern</text>
    <text x="20" y="148" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">software workflows by creating</text>
    <text x="20" y="171" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38BDF8">scalable, autonomous pipelines</text>
    <text x="20" y="194" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38BDF8">for real-world impact." █</text>
  </g>
</svg>
